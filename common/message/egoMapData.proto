//
// \brief Define map element information (lane lines, lane centerlines, etc.) around the ego.
// 定义主车周围地图元素(车道线、车道中心线等)信息.
//

syntax = "proto3";

package sim_msg;

import "header.proto";

message EgoMapData {

  enum LANE_ARROW {
    LANE_ARROW_None = 0;
    LANE_ARROW_Straight = 1;
    LANE_ARROW_Left = 2;
    LANE_ARROW_Right = 3;
    LANE_ARROW_Uturn = 4;
    LANE_ARROW_SkewLeft = 5;
    LANE_ARROW_SkewRight = 6;
    LANE_ARROW_StraightLeft = 7;
    LANE_ARROW_StraightRight = 8;
    LANE_ARROW_LeftRight = 9;
    LANE_ARROW_LeftUturn = 10;
    LANE_ARROW_StraightUturn = 11;
  }

  message Lane {

    uint64 road_id = 1;

    int64 lane_id = 2;

    LANE_ARROW arrow = 3;

    double length = 4;

  }

  message Link{

    uint64 link_id = 1;

    uint64 from_road_id = 2;

    uint64 from_section_id = 3;

    int64 from_lane_id = 4;

    uint64 to_road_id = 5;

    uint64 to_section_id = 6;

    int64 to_lane_id = 7;

    uint64 junction_id = 8;

    double length = 9;
  }

  message RouteNode{
    
    enum Type {
      TYPE_UNKNOWN = 0;
      TYPE_LANE = 1;
      TYPE_LINK = 2;
    }

    oneof node {
      Lane lane = 1;
      Link link = 2;
    }
  }

  Header header = 1;

  repeated RouteNode route_nodes = 2;

  bool on_lane = 3;

  bool on_link = 4;

  double s = 5;

  double l = 6;

  double yaw = 7;

  double dis_to_end = 8;

}
